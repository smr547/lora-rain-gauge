@startuml
title Rain Gauge — AO Collaboration

skinparam linetype ortho
top to bottom direction

component "TippingBucket" as TippingBucket <<AO>>
component "Control" as Control <<AO>>
component "Radio" as Radio <<AO>>
component "BucketReedSwitch" as BucketReedSwitch <<ISR>>
component "RadioDIO0" as RadioDIO0 <<ISR>>
component "◷ <b>SleepTimer</b>\nOne-shot; inactivity interval" as SleepTimer <<TIMER>>

SleepTimer - -> Control
note on link
  SleepTimer -> Control
    CONSIDER_SLEEPING
end note

BucketReedSwitch - -> TippingBucket
note on link
  BucketReedSwitch -> TippingBucket
    BUCKET_SWITCH_CLOSING
end note

TippingBucket <- -> Control
note on link
  TippingBucket -> Control
    BUCKET_TIPPED
    BUCKET_BUSY
    BUCKET_IDLE
    BUCKET_FAULT

  Control -> TippingBucket
    BUCKET_SWITCH_CLOSING
end note

Control <- -> Radio
note on link
  Control -> Radio
    SEND_REPORT

  Radio -> Control
    RADIO_BUSY
    RADIO_IDLE
end note

Radio <- - RadioDIO0
note on link
  RadioDIO0 -> Radio
    RADIO_TX_DONE
end note

@enduml

